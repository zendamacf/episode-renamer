name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches pyproject.toml version
        id: version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match pyproject.toml version ${VERSION} (expected v${VERSION})"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Ensure changelog was built
        run: |
          if find changes -mindepth 1 -type f ! -name 'README.md' | grep -q .; then
            echo "::error::Unreleased towncrier fragments remain in changes/. Run: towncrier build --version ${{ steps.version.outputs.version }}"
            find changes -mindepth 1 -type f ! -name 'README.md'
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make check


      - name: Test
        run: make test

      - name: Extract release notes
        id: notes
        run: |
          python <<'EOF' > release-notes.md
          import re
          import sys

          version = "${{ steps.version.outputs.version }}"
          with open("CHANGELOG.md") as f:
              content = f.read()

          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          match = re.search(pattern, content, re.DOTALL)
          if not match:
              print(f"::error::No changelog section found for version {version}", file=sys.stderr)
              sys.exit(1)

          section = match.group(0).strip()
          # Drop the heading; the GitHub release title already includes the version.
          body = re.sub(rf"^## \[{re.escape(version)}\][^\n]*\n?", "", section, count=1).strip()
          print(body)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
