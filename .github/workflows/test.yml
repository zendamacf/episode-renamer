name: Tests
 
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt

      - name: Lint
        run: make check


      - name: Fetch Dependabot metadata
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]'
        id: dependabot_metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Add towncrier fragment for Dependabot
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]'
        id: dependabot_fragment
        run: |
          FRAGMENT="changes/${{ github.event.pull_request.number }}.misc.md"
          if [ -f "$FRAGMENT" ]; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CONTENT="Bump ${{ steps.dependabot_metadata.outputs.dependency-names }} from ${{ steps.dependabot_metadata.outputs.previous-version }} to ${{ steps.dependabot_metadata.outputs.new-version }}."
          towncrier create "${{ github.event.pull_request.number }}.misc.md" --content "$CONTENT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FRAGMENT"
          git commit -m "chore: add towncrier fragment for dependabot [dependabot skip]"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push Dependabot towncrier fragment
        if: >-
          github.event_name == 'pull_request' &&
          steps.dependabot_fragment.outputs.committed == 'true'
        run: git push

      - name: Check changelog fragments
        if: github.event_name == 'pull_request'
        run: |
          towncrier check --compare-with origin/${{ github.base_ref }}

      - name: Test
        run: make test

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Coverage comment
        id: coverage_comment
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 95

      - name: Store coverage comment for fork PRs
        if: >-
          github.event_name == 'pull_request' &&
          steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
