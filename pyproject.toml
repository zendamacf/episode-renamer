[project]
name = "episode-renamer"
version = "0.2.0"
description = "Rename TV episode files using The Movie Database"
readme = "README.md"
requires-python = ">=3.14"

[tool.towncrier]
name = "episode-renamer"
directory = "changes"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}](https://github.com/zendamacf/episode-renamer/releases/tag/v{version}) ({project_date})"
issue_format = "[#{issue}](https://github.com/zendamacf/episode-renamer/issues/{issue})"
underlines = ["", ""]

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Misc"
showcontent = false

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["*/.venv/*"]

[tool.ruff.lint]
# This repo uses tabs for indentation, so we intentionally ignore
# tab-related indentation diagnostics.
ignore = ["W191", "E117"]
# Keep the initial migration close to the existing flake8 behavior
# (pycodestyle + pyflakes core rules).
select = ["E", "F", "W"]

[tool.ruff.format]
# Preserve the repo's tab-indented style.
indent-style = "tab"
quote-style = "single"

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["."]
exclude = ["**/__pycache__", ".venv", ".git"]
# `requests` is a runtime dependency; we don't want missing-stub noise here.
reportMissingTypeStubs = false
# Avoid failing the build for non-error diagnostics during initial adoption.
failOnWarnings = false
